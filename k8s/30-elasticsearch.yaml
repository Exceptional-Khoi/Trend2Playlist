# Elasticsearch - serving layer (batch view + realtime view). Profile "lite": 1 node.
# Profile "full" dùng k8s/profiles/full/30-elasticsearch.yaml (3 node, replica 1).
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: music
spec:
  selector: { app: elasticsearch }
  ports:
    - { name: http, port: 9200 }
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-headless
  namespace: music
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: elasticsearch }
  ports:
    - { name: transport, port: 9300 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: music
spec:
  serviceName: elasticsearch-headless
  replicas: 1
  selector:
    matchLabels: { app: elasticsearch }
  template:
    metadata:
      labels: { app: elasticsearch }
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.19.22
          env:
            - { name: cluster.name, value: music-es }
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }   # demo nội bộ cluster, không mở ra Internet
            - { name: xpack.ml.enabled, value: "false" }
            - { name: node.store.allow_mmap, value: "false" }   # khỏi cần chỉnh vm.max_map_count trên node
            - { name: cluster.routing.allocation.disk.threshold_enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m" }
          ports:
            - { name: http, containerPort: 9200 }
            - { name: transport, containerPort: 9300 }
          readinessProbe:
            httpGet: { path: "/_cluster/health?local=true", port: 9200 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 300m, memory: 1Gi }
            limits: { memory: 1400Mi }
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
