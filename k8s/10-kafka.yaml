# Apache Kafka 3.9 chế độ KRaft (không ZooKeeper): 3 node, mỗi node vừa là broker vừa là controller.
# Topic có replication-factor 3, min.insync.replicas 2 -> chết 1 broker vẫn đọc/ghi bình thường.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: music
spec:
  clusterIP: None
  publishNotReadyAddresses: true   # các controller cần thấy nhau trước khi "ready"
  selector: { app: kafka }
  ports:
    - { name: broker, port: 9092 }
    - { name: controller, port: 9093 }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-bootstrap
  namespace: music
spec:
  selector: { app: kafka }
  ports:
    - { name: broker, port: 9092 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka
  namespace: music
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: kafka }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: music
spec:
  serviceName: kafka-headless
  replicas: 3                       # đổi số node phải sửa KAFKA_CONTROLLER_QUORUM_VOTERS
  podManagementPolicy: Parallel     # 3 controller phải khởi động cùng lúc để bầu leader
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      enableServiceLinks: false     # tránh biến KAFKA_PORT... do k8s tự sinh làm hỏng cấu hình
      securityContext: { fsGroup: 1000 }
      affinity:
        podAntiAffinity:            # rải các broker ra các node khác nhau (nếu cluster nhiều node)
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: kafka }
      containers:
        - name: kafka
          image: apache/kafka:3.9.2
          command: ["/bin/bash", "-c"]
          args:
            - |
              export KAFKA_NODE_ID=${HOSTNAME##*-}
              export KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://${HOSTNAME}.kafka-headless.music.svc.cluster.local:9092
              exec /etc/kafka/docker/run
          env:
            - { name: CLUSTER_ID, value: "ebbvPR7PTp6jZca7XytNdQ" }   # UUID base64 (22 ký tự), cố định cho cả cụm
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka-headless.music.svc.cluster.local:9093,1@kafka-1.kafka-headless.music.svc.cluster.local:9093,2@kafka-2.kafka-headless.music.svc.cluster.local:9093"
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data/logs" }
            - { name: KAFKA_NUM_PARTITIONS, value: "6" }
            - { name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_MIN_INSYNC_REPLICAS, value: "2" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "3" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "2" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: KAFKA_LOG_RETENTION_HOURS, value: "168" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx256m" }
          ports:
            - { name: broker, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 3Gi } }
