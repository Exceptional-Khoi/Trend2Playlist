# Tạo index template music-* (chuỗi -> keyword, *_ms -> date). Idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: es-setup
  namespace: music
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: python:3.12-slim
          command: ["sh", "-c", "pip install -q --no-cache-dir httpx==0.28.1 && python /app/es_setup.py"]
          envFrom: [{ configMapRef: { name: music-env } }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: code, mountPath: /app }
      volumes:
        - name: code
          configMap: { name: serving-code }
