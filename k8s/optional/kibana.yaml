# (Tuỳ chọn) Kibana để khám phá dữ liệu trong ES. Tốn ~700MB RAM nên không bật mặc định.
#   kubectl apply -f k8s/optional/kibana.yaml ; kubectl -n music port-forward svc/kibana 5601:5601
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: music
spec:
  selector: { app: kibana }
  ports:
    - { name: http, port: 5601 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: music
spec:
  replicas: 1
  selector:
    matchLabels: { app: kibana }
  template:
    metadata:
      labels: { app: kibana }
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.19.22
          env:
            - { name: ELASTICSEARCH_HOSTS, value: "http://elasticsearch.music.svc.cluster.local:9200" }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=512" }
          ports:
            - { containerPort: 5601 }
          resources:
            requests: { cpu: 200m, memory: 700Mi }
            limits: { memory: 1Gi }
