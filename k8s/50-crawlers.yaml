# THU THẬP DỮ LIỆU: crawler chạy theo lịch trong pod, đẩy thẳng vào Kafka (không ghi file trên máy ai cả).
#   crawl-charts    : 30 phút/lần - BXH Zing MP3, Spotify, Apple Music, YouTube
#   crawl-playlists : 6 giờ/lần   - playlist theo thể loại (thể loại + dữ liệu đồng xuất hiện)
#   crawl-comments  : mỗi giờ     - bình luận YouTube, 3 pod song song (Indexed Job, mỗi pod 1 shard video)
#   crawl-trends    : hằng ngày   - Google Trends theo tỉnh cho 40 bài hot (chạy chậm ~15 phút để tránh bị chặn 429)
#   crawl-geo       : hằng ngày   - (cần YOUTUBE_API_KEY) video âm nhạc gắn vị trí gần từng tỉnh; mặc định tạm dừng
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crawl-charts
  namespace: music
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels: { app: crawler, job: charts }
        spec:
          restartPolicy: Never
          containers:
            - name: crawler
              image: python:3.12-slim
              command: ["sh", "-c", "pip install -q --no-cache-dir -r /app/requirements.txt && exec python /app/run_crawler.py --job charts"]
              envFrom:
                - configMapRef: { name: music-env }
                - secretRef: { name: music-secrets, optional: true }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 384Mi }
              volumeMounts:
                - { name: code, mountPath: /app }
          volumes:
            - name: code
              configMap: { name: crawler-code }
---
