# SPEED LAYER: 1 driver Spark Structured Streaming chạy liên tục (5 query, xem spark/speed_layer.py).
# Pod chết -> Deployment tạo lại -> Spark đọc checkpoint trên HDFS và chạy tiếp từ offset Kafka cuối.
apiVersion: v1
kind: Service
metadata:
  name: speed-layer-ui
  namespace: music
spec:
  selector: { app: speed-layer }
  ports:
    - { name: ui, port: 4040 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speed-layer
  namespace: music
spec:
  replicas: 1                      # luôn đúng 1 driver cho 1 bộ checkpoint
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: speed-layer }
  template:
    metadata:
      labels: { app: speed-layer }
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c", "for hp in kafka-bootstrap:9092 hdfs-namenode:8020 elasticsearch:9200 spark-master:7077; do until nc -z ${hp%:*}.music.svc.cluster.local ${hp#*:}; do echo waiting $hp; sleep 3; done; done"]
      containers:
        - name: driver
          image: apache/spark:3.5.9-scala2.12-java17-python3-ubuntu
          command: ["/bin/bash", "-c"]
          args: ["exec bash /opt/app/submit.sh speed_layer.py speed-layer $SPEED_CORES_MAX"]
          envFrom: [{ configMapRef: { name: music-env } }]
          env:
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - { name: DRIVER_MEMORY, value: "700m" }
            - { name: SPEED_QUERIES, value: "ingest,plays,mentions,charts,recommend" }
          ports:
            - { name: ui, containerPort: 4040 }
          resources:
            requests: { cpu: 300m, memory: 1Gi }
            limits: { memory: 1400Mi }
          volumeMounts:
            - { name: code, mountPath: /opt/app }
      volumes:
        - name: code
          configMap: { name: spark-code }
