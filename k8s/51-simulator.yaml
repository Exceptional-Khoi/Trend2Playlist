# Bộ giả lập người nghe -> Kafka music.events. Mỗi replica = 1 nhóm người nghe riêng (sim<ordinal>-xxxx).
# Tăng tải để test scalability:  kubectl -n music scale statefulset listener-sim --replicas=6
apiVersion: v1
kind: Service
metadata:
  name: listener-sim
  namespace: music
spec:
  clusterIP: None
  selector: { app: listener-sim }
  ports:
    - { name: none, port: 80 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: listener-sim
  namespace: music
spec:
  serviceName: listener-sim
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: listener-sim }
  template:
    metadata:
      labels: { app: listener-sim }
    spec:
      containers:
        - name: simulator
          image: python:3.12-slim
          command: ["sh", "-c", "pip install -q --no-cache-dir -r /app/requirements.txt && exec python /app/simulator.py"]
          envFrom: [{ configMapRef: { name: music-env } }]
          env:
            - { name: SIM_USERS, value: "300" }
            - { name: SIM_EVENTS_PER_SEC, value: "5" }
            - { name: SIM_DIURNAL, value: "false" }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: code, mountPath: /app }
      volumes:
        - name: code
          configMap: { name: crawler-code }
