# SERVING: REST API + dashboard (FastAPI). 2 replica sau 1 Service; HPA tự tăng tới 6 pod khi CPU > 60%.
# Truy cập:  minikube service -n music music-api     hoặc   kubectl -n music port-forward svc/music-api 8000:80
apiVersion: v1
kind: Service
metadata:
  name: music-api
  namespace: music
spec:
  type: NodePort
  selector: { app: music-api }
  ports:
    - { name: http, port: 80, targetPort: 8000, nodePort: 30080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-api
  namespace: music
spec:
  replicas: 2
  selector:
    matchLabels: { app: music-api }
  template:
    metadata:
      labels: { app: music-api }
    spec:
      containers:
        - name: api
          image: python:3.12-slim
          workingDir: /app
          command: ["sh", "-c", "pip install -q --no-cache-dir -r /app/requirements.txt && exec uvicorn api:app --host 0.0.0.0 --port 8000 --proxy-headers"]
          envFrom: [{ configMapRef: { name: music-env } }]
          env:
            - { name: STATIC_DIR, value: /static }
            - { name: MERGE_WEIGHTS, value: "0.6,0.3,0.1" }
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { cpu: 500m, memory: 384Mi }
          volumeMounts:
            - { name: code, mountPath: /app }
            - { name: static, mountPath: /static }
      volumes:
        - name: code
          configMap: { name: serving-code }
        - name: static
          configMap: { name: dashboard-static }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: music-api
  namespace: music
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: music-api }
---
# Cần metrics-server (minikube: minikube addons enable metrics-server; GKE có sẵn)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: music-api
  namespace: music
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: music-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
