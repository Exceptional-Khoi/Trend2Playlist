<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Pulse · Phân tích âm nhạc</title><link rel="stylesheet" href="/static/insights.css"></head>
<body><header><div class="eyebrow">MUSIC PULSE</div><h1>Khám phá âm nhạc</h1>
</header>
<main><nav aria-label="Chức năng phân tích">
<button data-feature="lifecycle" aria-pressed="true">Thứ hạng bài hát</button>
<button data-feature="playlists" aria-pressed="false">Bài hát trong playlist</button>
<button data-feature="countries" aria-pressed="false">Bản đồ âm nhạc</button>
<button data-feature="comments" aria-pressed="false">Khán giả nói gì?</button></nav>
<form id="filters"><label>Đến ngày<input id="as-of" type="date"></label>
<label>Khoảng thời gian<select id="days"><option value="1">1 ngày</option><option value="7">7 ngày</option><option value="30" selected>30 ngày</option><option value="90">90 ngày</option><option value="365">365 ngày</option></select></label>
<label class="country-filter" hidden>Quốc gia<select id="countries"><option value="">Tất cả quốc gia</option></select></label>
<label class="comment-filter" hidden>Bình luận<select id="comment-sort"><option value="all">Tất cả</option><option value="recent">Nhóm mới nhất</option><option value="popular">Nhóm nổi bật</option></select></label>
<button type="submit" id="refresh">Xem kết quả</button></form>
<p id="status" role="status" aria-live="polite"></p><section class="intro"><h2 id="heading"></h2><p id="description"></p></section>
<section id="results" aria-label="Kết quả phân tích"></section>
</main>
<script src="/static/insights.js"></script></body></html>
