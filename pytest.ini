[pytest]
testpaths = tests
markers =
    cloud: opt-in real isolated cloud services
    cloud_case: cloud campaign identity, oracle and budget
    e2e: real end-to-end data flow
    integration: real service integration
    reliability: controlled recovery in owned namespace
    performance: bounded measured load
    destructive: isolated owned fault injection only
    qa_case(id, requirement): adversarial QA traceability
    qa_property: generated property-based inputs
    qa_integration: requires owned disposable local dependencies
    qa_performance: bounded measured local workload
    qa_browser: real browser DOM with isolated backend fixtures
